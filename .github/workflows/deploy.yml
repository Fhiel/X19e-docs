name: Deploy Documentation
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google Chrome & Puppeteer CLI (For reliable PDF)
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser --no-install-recommends
          npm install -g @puppeteer/cli

      - name: Install Python Dependencies
        run: |
          pip install mkdocs-material mkdocs-enumerate-headings-plugin

      - name: Build Static Site HTML
        run: |
          mkdocs build

      - name: Generate PDF via Headless Chrome
        run: |
          mkdir -p site/downloads
          # Chrome druckt die gebaute Index-Datei inklusive aller CSS-Styles direkt als PDF
          chromium-browser --headless --disable-gpu --print-to-pdf=site/downloads/X19e_Technische_Dokumentation.pdf site/index.html

      - name: Deploy to GitHub Pages
        run: |
          mkdocs gh-deploy --force