name: Deploy Documentation
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install mkdocs-material mkdocs-enumerate-headings-plugin mkdocs-print-site-plugin

      # 1. ZUERST bauen wir die ganz normale Haupt-Webseite. Das Ergebnis landet sauber in /site
      # (Hierbei entsteht automatisch der unvollständige Ordner site/print_page/)
      - name: Build main site
        run: |
          mkdocs build --site-dir site

      # 2. JETZT bauen wir die perfekte Druckseite separat aus der print.yml in einen eigenen Ordner
      - name: Build perfect print site
        run: |
          mkdocs build --config-file mkdocs.print.yml --site-dir site_print

      # 3. DER CHIRURGISCHE SCHNITT: Wir löschen die unvollständige Druckseite der Hauptseite 
      # und ersetzen sie exakt an der Stelle, wo das Plugin sie erwartet, durch die perfekte Druckseite!
      - name: Replace legacy print page with perfect build
        run: |
          rm -rf site/print_page
          mkdir -p site/print_page
          cp -r site_print/print_page/* site/print_page/
          rm -rf site_print

      # 4. GITHUB-DEPLOYMENT: Schiebt den perfekt manipulierten /site Ordner direkt online
      - name: Upload artifact and deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true