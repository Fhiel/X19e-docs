name: Deploy Documentation
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install mkdocs-material mkdocs-enumerate-headings-plugin mkdocs-print-site-plugin pyyaml

      # ----------------------------------------------------------------------
      # DER AUTOMATISCHE TOC-PARSER (LETZTER STAND)
      # ----------------------------------------------------------------------
      - name: Dynamically Generate TOC and Print Config
        run: |
          python - <<'PY'
          import yaml
          import os
          import re

          with open('mkdocs.yml', 'r', encoding='utf-8') as f:
              config = yaml.safe_load(f)

          def extract_files(nav_item):
              files = []
              if isinstance(nav_item, dict):
                  for value in nav_item.values():
                      files.extend(extract_files(value))
              elif isinstance(nav_item, list):
                  for item in nav_item:
                      files.extend(extract_files(item))
              elif isinstance(nav_item, str) and not nav_item.endswith('index.md') and not nav_item.endswith('toc.md'):
                  files.append(nav_item)
              return files

          doc_files = extract_files(config.get('nav', []))

          # TOC Generierung mit dem Zähl-Schutz toc_lines = [
              "# Inhaltsverzeichnis \n\n", 
              "<div class=\"print-site-toc-page\">\n", 
              "<ul>\n"
          ]

          def slugify(text):
              text = text.lower().strip()
              text = re.sub(r'[^\w\s-]', '', text)
              text = re.sub(r'[\s_-]+', '-', text)
              return text

          for file_path in doc_files:
              full_path = os.path.join('docs', file_path)
              if os.path.exists(full_path):
                  with open(full_path, 'r', encoding='utf-8') as f:
                      for line in f:
                          match = re.match(re.compile(r'^(#{1,3})\s+(.*)'), line)
                          if match:
                              level = len(match.group(1))
                              title = match.group(2).strip()
                              clean_title = re.sub(r'^[0-9.]+\s+', '', title)
                              anchor = slugify(clean_title)
                              
                              if level == 1:
                                  toc_lines.append(f'  <li><a href="#{anchor}">{title}</a></li>\n')
                              elif level == 2:
                                  toc_lines.append(f'  <li style="padding-left: 20px;"><a href="#{anchor}">{title}</a></li>\n')
                              elif level == 3:
                                  toc_lines.append(f'  <li style="padding-left: 40px;"><a href="#{anchor}">{title}</a></li>\n')

          toc_lines.extend(["</ul>\n", "</div>\n", "\n<div style=\"page-break-before: always;\"></div>\n"])

          with open('docs/toc.md', 'w', encoding='utf-8') as f:
              f.writelines(toc_lines)

          # Button in index.md patchen
          index_path = 'docs/index.md'
          if os.path.exists(index_path):
              with open(index_path, 'r', encoding='utf-8') as f:
                  index_content = f.read()
              download_btn = "\n\n[:octicons-file-pdf-24: Technische Dokumentation als PDF drucken](print_page/index.html){ .md-button .md-button--primary }\n"
              if "print_page/index.html" not in index_content:
                  with open(index_path, 'a', encoding='utf-8') as f:
                      f.write(download_btn)

          # Druck-Konfiguration schreiben
          print_nav = [{"Inhaltsverzeichnis": "toc.md"}]
          for item in config.get('nav', []):
              if isinstance(item, dict) and 'Home' in item:
                  continue
              print_nav.append(item)

          config['nav'] = print_nav

          if 'plugins' in config:
              config['plugins'] = [
                  'search',
                  {'enumerate-headings': {'strict': True, 'exclude': ['toc.md']}},
                  {'print-site': {
                      'add_to_navigation': False,
                      'add_cover_page': False,
                      'add_table_of_contents': False
                  }}
              ]

          with open('mkdocs.print.yml', 'w', encoding='utf-8') as f:
              yaml.dump(config, f, allow_unicode=True)
          PY

      # 4. Normaler Web-Build
      - name: Build Web Site
        run: |
          mkdocs build --config-file mkdocs.yml --site-dir site

      # 5. Druck-Build
      - name: Build Print Site
        run: |
          mkdocs build --config-file mkdocs.print.yml --site-dir site/print_page