name: Deploy Documentation
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install mkdocs-material mkdocs-enumerate-headings-plugin mkdocs-print-site-plugin

      # Baue die Druckseite mit der dedizierten Druck-Konfiguration
      - name: Build print site
        run: |
          mkdocs build --config-file mkdocs.print.yml --site-dir site_print

      # Schiebe die fertige Druckseite als statisches Asset in den docs-Ordner der Hauptseite
      - name: Inject print site into docs
        run: |
          mkdir -p docs/print
          cp -r site_print/* docs/print/
          rm -rf site_print

      # Der finale Deploy baut das Hauptsystem und lädt alles hoch
      - name: Deploy to GitHub Pages
        run: |
          mkdocs gh-deploy --force