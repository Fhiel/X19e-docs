name: Deploy Documentation
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install mkdocs-material mkdocs-enumerate-headings-plugin mkdocs-print-site-plugin

      - name: Build normal site (with enumerate-headings)
        run: |
          mkdocs build

      - name: Build print site (without enumerate-headings)
        run: |
          # create a temporary mkdocs config that removes the enumerate-headings plugin
          python - <<'PY'
import yaml,sys
cfg = yaml.safe_load(open('mkdocs.yml'))
# remove enumerate-headings from plugins list
plugins = cfg.get('plugins', [])
new_plugins = []
for p in plugins:
    if isinstance(p, dict) and 'enumerate-headings' in p:
        continue
    if p == 'enumerate-headings':
        continue
    new_plugins.append(p)
cfg['plugins'] = new_plugins
open('mkdocs.print.yml','w').write(yaml.safe_dump(cfg, sort_keys=False))
print('Wrote mkdocs.print.yml without enumerate-headings')
PY
          mkdocs build --config-file mkdocs.print.yml --site-dir site_print
          # place the generated print output into the main site so it will be published
          mkdir -p site/print
          cp -r site_print/* site/print/
          rm mkdocs.print.yml

      - name: Deploy to GitHub Pages
        run: |
          mkdocs gh-deploy --force
