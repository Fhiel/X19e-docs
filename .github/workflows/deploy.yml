name: Deploy Documentation

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libffi-dev libjpeg-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install mkdocs-material mkdocs-to-pdf weasyprint

      - name: Build + PDF
        run: |
          mkdocs build --verbose
          echo "=== PDF Check ==="
          ls -la site/pdf/ || echo "Kein pdf-Ordner"
          find site -name "*.pdf" -type f || echo "Keine PDF gefunden"