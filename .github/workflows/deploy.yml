name: Deploy Documentation

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install mkdocs-material mkdocs-to-pdf weasyprint

      - name: Build MkDocs & Generate PDF
        run: |
          mkdocs build
          # PDF wird automatisch im pdf/ Ordner erzeugt

      - name: Deploy to GitHub Pages
        run: |
          mkdocs gh-deploy --force