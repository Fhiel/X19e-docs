name: Deploy Documentation
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install mkdocs-material mkdocs-enumerate-headings-plugin mkdocs-print-site-plugin

      # 1. Wir bauen die Druckversion aus der print.yml in einen temporären Ordner
      # (Ohne die index.md im NAV, damit das Verzeichnis fehlerfrei startet!)
      - name: Build print site
        run: |
          mkdocs build --config-file mkdocs.print.yml --site-dir site_print

      # 2. Wir kopieren die fertigen Druckdateien als statischen Ordner direkt in docs/
      # Dadurch wird er im nächsten Schritt automatisch Teil der Hauptseite
      - name: Inject print site into docs
        run: |
          mkdir -p docs/print
          cp -r site_print/* docs/print/
          rm -rf site_print

      # 3. Wir bauen die Haupt-Webseite. Das Ergebnis landet sauber in /site
      - name: Build main site
        run: |
          mkdocs build --site-dir site

      # 4. GITHUB-EIGENER UPLOAD: Schiebt den fertigen /site Ordner ohne Neubau ins Netz!
      - name: Upload artifact and deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true