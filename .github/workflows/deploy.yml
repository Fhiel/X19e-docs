name: Deploy Documentation
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Holt die Historie, damit das git-revision-date Plugin nicht abstürzt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install mkdocs-material mkdocs-enumerate-headings-plugin mkdocs-print-site-plugin mkdocs-git-revision-date-localized-plugin pyyaml

      # ----------------------------------------------------------------------
      # NATIVE CONFIG GENERIERUNG (Wartet deine mkdocs.print.yml automatisch)
      # ----------------------------------------------------------------------
      - name: Dynamically Generate Print Config
        run: |
          python generate_print.py

      # 4. Normaler Web-Build
      - name: Build Web Site
        run: |
          mkdocs build --config-file mkdocs.yml --site-dir site

      # 5. Druck-Build
      - name: Build Print Site
        run: |
          mkdocs build --config-file mkdocs.print.yml --site-dir site/print_page