name: Deploy Documentation
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (WeasyPrint & Pandoc)
        run: |
          sudo apt-get update
          sudo apt-get install -y weasyprint pandoc libpango-1.0-0 libharfbuzz0b ijsgsl

      - name: Install Python Dependencies
        run: |
          pip install mkdocs-material mkdocs-enumerate-headings-plugin

      - name: Build Web Edition (MkDocs)
        run: |
          mkdocs build

      - name: Compile Document Structure for PDF
        run: |
          # Erstellt ein sauberes Inhaltsverzeichnis-Skelett für WeasyPrint
          cat << 'EOF' > toc.md
          # Inhaltsverzeichnis
          
          <div class="toc-item"><a href="#technische-kurzbeschreibung">Technische Kurzbeschreibung</a></div>
          <div class="toc-item"><a href="#funktionssicherheit">Funktionssicherheit</a></div>
          <div class="toc-item"><a href="#elektrische-sicherheit">Elektrische Sicherheit</a></div>
          <div class="toc-item"><a href="#sicherheit-des-energiespeichers">Sicherheit des Energiespeichers</a></div>
          <div class="toc-item"><a href="#umweltschutz-und-umweltverträglichkeit">Umweltschutz und Umweltverträglichkeit</a></div>
          <div class="toc-item"><a href="#umfassender-personenschutz-schutz-für-dritte">Umfassender Personenschutz - Schutz für Dritte</a></div>
          EOF

          # Fusioniert alle Quelldateien ohne MkDocs-Ballast zu einer reinen HTML-Struktur
          pandoc docs/index.md toc.md \
            docs/kurzbeschreibung.md \
            docs/funktionssicherheit.md \
            docs/elektrische_sicherheit.md \
            docs/sicherheit_des_energiespeichers.md \
            docs/umweltschutz_und_vertraeglichkeit.md \
            docs/umfassender_personenschutz.md \
            -f markdown -t html5 -o content.html

      - name: Generate Professional PDF via WeasyPrint
        run: |
          mkdir -p site/downloads
          weasyprint -s docs/stylesheets/pdf_print.css content.html site/downloads/X19e_Technische_Dokumentation.pdf

      - name: Deploy to GitHub Pages
        run: |
          mkdocs gh-deploy --force