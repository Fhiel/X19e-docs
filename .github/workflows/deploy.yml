name: Deploy Documentation
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install mkdocs-material mkdocs-enumerate-headings-plugin mkdocs-print-site-plugin

      # 1. Wir bauen zuerst die normale Haupt-Webseite. Das Ergebnis landet in /site
      - name: Build main site
        run: |
          mkdocs build --site-dir site

      # 2. Jetzt bauen wir die perfekte Druckseite separat aus der print.yml
      - name: Build perfect print site
        run: |
          mkdocs build --config-file mkdocs.print.yml --site-dir site_print

      # 3. DER GENIALE SCHNITT: Wir überschreiben die fehlerhafte Druckseite der Hauptseite
      # mit der perfekten Druckseite aus dem separaten Build!
      - name: Overwrite legacy print page with perfect print site
        run: |
          rm -rf site/print_page
          mkdir -p site/print_page
          cp -r site_print/print_page/* site/print_page/
          rm -rf site_print

      # 4. Sauberer Upload direkt ins Netz
      - name: Upload artifact and deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true