name: Deploy Documentation
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install mkdocs-material mkdocs-enumerate-headings-plugin mkdocs-print-site-plugin

      # 1. Druckversion separat in temporären Ordner bauen
      - name: Build print site
        run: |
          mkdocs build --config-file mkdocs.print.yml --site-dir site_print

      # 2. Druckversion in docs/print/ injizieren
      - name: Inject print site into docs
        run: |
          mkdir -p docs/print
          cp -r site_print/* docs/print/
          rm -rf site_print

      # 3. Haupt-Webseite in /site bauen
      - name: Build main site
        run: |
          mkdocs build --site-dir site

      # 4. CHIRURGISCHER SCHNITT: Die alte, fehlerhafte Druckseite restlos auslöschen!
      # Verhindert, dass der falsche Link jemals wieder ein Ziel findet.
      - name: Remove legacy print page artifact
        run: |
          rm -rf site/print_page

      # 5. Sauberer Upload ohne Neubau-Voodoo
      - name: Upload artifact and deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true