site_name: "X1/9e - Technische Dokumentation"
site_author: "Frank Hielscher"

theme:
  name: material
  language: de
  font:
    text: Montserrat
    code: Roboto Mono
  palette:
    - scheme: slate
      primary: black
      accent: amber

extra_css:
  - stylesheets/custom.css

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - admonition
  - def_list
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true

nav:
  - Home: index.md
  - Technische Kurzbeschreibung: kurzbeschreibung.md
  - Funktionssicherheit: funktionssicherheit.md
  - Elektrische Sicherheit: elektrische_sicherheit.md
  - Sicherheit des Energiespeichers: sicherheit_des_energiespeichers.md
  - Umweltschutz und Umweltverträglichkeit: umweltschutz_und_vertraeglichkeit.md
  - Umfassender Personenschutz - Schutz für Dritte: umfassender_personenschutz.md
  # - Anhang: anhang.md

plugins:
  - search
  # HIER IST ENUMERATE-HEADINGS RAUS!
  - print-site:
      add_to_navigation: false
      add_cover_page: false
      add_table_of_contents: true   # Das Plugin darf hier nativ das volle Verzeichnis bauen!
      toc_title: "Inhaltsverzeichnis"
      toc_depth: 3                  # Holt H1, H2 und H3 mit Seitenzahlen rein
      enumerate_headings: true       # Das Plugin übernimmt die Nummerierung im Fließtext
      include_css: true             # Lädt die nötigen Stile für Seitenzahlen
      exclude:
        - 'index.md'