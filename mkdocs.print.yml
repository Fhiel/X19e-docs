site_name: "X1/9e - Technische Dokumentation"
site_author: "Frank Hielscher"

theme:
  name: material
  language: de
  font:
    text: Montserrat
    code: Roboto Mono
  palette:
    - scheme: slate
      primary: black
      accent: amber

extra_css:
  - stylesheets/custom.css

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - admonition
  - def_list
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true

# RADIKALER SCHNITT: Keine index.md mehr in der Druckversion!
nav:
  - Technische Kurzbeschreibung: kurzbeschreibung.md
  - Funktionssicherheit: funktionssicherheit.md
  - Elektrische Sicherheit: elektrische_sicherheit.md
  - Sicherheit des Energiespeichers: sicherheit_des_energiespeichers.md
  - Umweltschutz und Umweltverträglichkeit: umweltschutz_und_vertraeglichkeit.md
  - Umfassender Personenschutz - Schutz für Dritte: umfassender_personenschutz.md
  - Anhang: anhang.md

plugins:
  - search
  # Das Zähl-Plugin steuert die Nummern im Fließtext absolut sauber
  - enumerate-headings:
      strict: true
      heading_depth: 4
      exclude:
        - print_page.md # Ignoriert die Überschrift des Inhaltsverzeichnisses
  # Das Print-Plugin baut NUR noch die Struktur
  - print-site:
      add_to_navigation: false
      add_cover_page: false
      add_table_of_contents: true   # Automatisch an!
      toc_title: "Inhaltsverzeichnis"
      toc_depth: 3
      enumerate_headings: false     # Dem Print-Plugin verbieten zu pfuschen
      include_css: true             # Aktiv, damit die Struktur steht