extra_css:
- stylesheets/custom.css
extra_javascript:
- https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/MathJax.js?config=TeX-AMS-MML_HTMLorMML
markdown_extensions:
- tables
- attr_list
- md_in_html
- pymdownx.superfences
- admonition
- def_list
- toc:
    permalink: true
- pymdownx.arithmatex:
    generic: true
nav:
- Kurzbeschreibung: kurzbeschreibung.md
- Funktionssicherheit: funktionssicherheit.md
- Elektrische Sicherheit: elektrische_sicherheit.md
- Sicherheit Des Energiespeichers: sicherheit_des_energiespeichers.md
- Umweltschutz Und Vertraeglichkeit: umweltschutz_und_vertraeglichkeit.md
- Umfassender Personenschutz: umfassender_personenschutz.md
- Anhang:
  - Übersicht: anhang.md
  - (IMD): imd.md
  - (BMS): bms.md
  - Motor Controller: motor_controller.md
  - Charger: charger.md
  - Dc Dc: dc_dc.md
  - Iso R Test: iso_r_test.md
plugins:
- search
- git-revision-date-localized
- enumerate-headings:
    strict: true
- print-site:
    add_cover_page: false
    add_table_of_contents: false
    add_to_navigation: false
    exclude:
    - index.md
site_author: Frank Hielscher
site_name: X1/9e - Technische Dokumentation
theme:
  font:
    code: Roboto Mono
    text: Montserrat
  language: de
  name: material
  palette:
  - accent: amber
    primary: black
    scheme: slate
