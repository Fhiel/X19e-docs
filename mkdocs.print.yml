site_name: "X1/9e - Technische Dokumentation"
site_author: "Frank Hielscher"

theme:
  name: material
  language: de
  font:
    text: Montserrat
    code: Roboto Mono
  palette:
    - scheme: slate
      primary: black
      accent: amber

extra_css:
  - stylesheets/custom.css

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - admonition
  - def_list
  - toc:
      permalink: true
      slugify: !!python/name:pymdownx.slugs.uslugify # Falls du den Umlaut-Fix nutzt
      toc_depth: 3  # <-- DAS HIER REISST DIE STRUKTUR AUF EBENE 1, 2 UND 3 AUF!
  - pymdownx.arithmatex:
      generic: true
  


extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/MathJax.js?config=TeX-AMS-MML_HTMLorMML      

# Keine index.md im Druckstrom, damit die Zählung sauber startet
nav:
  - Technische Kurzbeschreibung: kurzbeschreibung.md
  - Funktionssicherheit: funktionssicherheit.md
  - Elektrische Sicherheit: elektrische_sicherheit.md
  - Sicherheit des Energiespeichers: sicherheit_des_energiespeichers.md
  - Umweltschutz und Umweltverträglichkeit: umweltschutz_und_vertraeglichkeit.md
  - Umfassender Personenschutz - Schutz für Dritte: umfassender_personenschutz.md
  - Anhang: anhang.md

plugins:
  - search
  - print-site:
      add_to_navigation: false
      add_cover_page: false
      add_table_of_contents: true
      toc_title: "Inhaltsverzeichnis"
      toc_depth: 3
      enumerate_headings: true       # Das Plugin nummeriert den Text im PDF durch
      include_css: true