site_name: "X1/9e - Technische Dokumentation"
site_author: "Frank Hielscher"

theme:
  name: material
  language: de
  font:
    text: Montserrat
    code: Roboto Mono
  palette:
    - scheme: slate
      primary: black
      accent: amber

extra_css:
  - stylesheets/custom.css

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - admonition
  - def_list
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/MathJax.js?config=TeX-AMS-MML_HTMLorMML

# ==========================================================================
# DEINE STRUKTURIERTE NAVIGATION (Inklusive modularer Anhangs-Dateien)
# ==========================================================================
nav:
  - Home: index.md
  - Technische Kurzbeschreibung: kurzbeschreibung.md
  - Funktionssicherheit: funktionssicherheit.md
  - Elektrische Sicherheit: elektrische_sicherheit.md
  - Sicherheit des Energiespeichers: sicherheit_des_energiespeichers.md
  - Umweltschutz und Umweltverträglichkeit: umweltschutz_und_vertraeglichkeit.md
  - Umfassender Personenschutz - Schutz für Dritte: umfassender_personenschutz.md
  - Anhang:
      - Übersicht: anhang.md
      - Isolationsüberwachungssystem (IMD): imd.md
      - Batterie-Management-System (BMS): bms.md
      - Inverter (MCU): mcu.md
      - Ladegerät (OBC): charger.md
      - DC-DC-Wandler (DC_DC): dc_dc.md
      - Vehicle Control Unit (VCU): vcu.md
      - Instrumente und Anzeigen: instruments.md
      - Fahrpedal: pedal.md
      - Wasserpumpe Batterie: bat_pump.md
      - Wasserpumpe Inverter: inv_pump.md
      - Iso-R Tester: iso_r_test.md
      # Weitere Dateien (z.B. motor_controller.md) einfach hier drunter einreihen!

# ==========================================================================
# PLUGINS (Saubere Zählung und Print-Vorbereitung für die Webseite)
# ==========================================================================
plugins:
  - search
  - enumerate-headings:
      strict: true
      exclude:
        - index.md   # Verhindert die Geister-"1" auf der Web-Startseite
        - toc.md     # Schützt das generierte Verzeichnis (wird im Web-Build ignoriert)
  - print-site:
      add_to_navigation: true
      print_page_title: "Druckversion (PDF)"
      add_cover_page: false
      add_table_of_contents: false # Deaktiviert, da unser Parser das perfekte TOC baut