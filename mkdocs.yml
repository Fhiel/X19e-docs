site_name: "X1/9e - Technische Dokumentation"
site_author: "Frank Hielscher"

theme:
  name: material
  language: de
  font:
    text: Montserrat
    code: Roboto Mono
  palette:
    - scheme: slate
      primary: black
      accent: amber

extra_css:
  - stylesheets/custom.css

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - admonition
  - def_list
  - toc:
      permalink: true
      slugify: !!python/name:pymdownx.slugs.uslugify

nav:
  - Home: index.md
  - Technische Kurzbeschreibung: kurzbeschreibung.md
  - Funktionssicherheit: funktionssicherheit.md
  - Elektrische Sicherheit: elektrische_sicherheit.md
  - Sicherheit des Energiespeichers: sicherheit_des_energiespeichers.md
  - Umweltschutz und Umweltverträglichkeit: umweltschutz_und_vertraeglichkeit.md
  - Umfassender Personenschutz - Schutz für Dritte: umfassender_personenschutz.md
  # Wenn du den Anhang erweiterst, schreibst du ihn einfach NUR hier drunter:
  # - Anhang: anhang.md

plugins:
  - search
  - enumerate-headings:
      strict: true
      toc_depth: 3
      # Das hier sorgt dafür, dass die index.md NIEMALS eine Nummer bekommt:
      exclude:
        - index.md
  - print-site:
      add_to_navigation: true
      print_page_title: "Druckversion (PDF)"
      add_cover_page: false         # Wir brauchen kein Plugin-Cover
      add_table_of_contents: true   # Das Plugin MUSS das Verzeichnis wieder selbst bauen!
      toc_title: 'Inhaltsverzeichnis'
      toc_depth: 3
      exclude:
        - 'index.md'
      

