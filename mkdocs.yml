site_name: "X1/9e - Technische Dokumentation"
site_author: "Frank Hielscher"

theme:
  name: material
  language: de
  font:
    text: Montserrat
    code: Roboto Mono
  palette:
    - scheme: slate
      primary: black
      accent: amber

extra_css:
  - stylesheets/custom.css

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - admonition
  - def_list
  - toc:
      permalink: true
  - pymdownx.arithmatex:      # für Formeln
      generic: true

nav:
  - Home: index.md
  - Technische Kurzbeschreibung: kurzbeschreibung.md
  - Funktionssicherheit: funktionssicherheit.md
  - Elektrische Sicherheit: elektrische_sicherheit.md
  - Sicherheit des Energiespeichers: sicherheit_des_energiespeichers.md
  - Umweltschutz und Umweltverträglichkeit: umweltschutz_und_vertraeglichkeit.md
  - Umfassender Personenschutz - Schutz für Dritte: umfassender_personenschutz.md

plugins:
  - search
  #- enumerate-headings:
  #    strict: true
  #    exclude:
  #      - index.md
  - to-pdf:
      enabled: true
      cover: true
      cover_title: ""                    # leer
      cover_subtitle: ""                 # leer
      custom_template_path: "templates"
      output_path: "pdf/X1-9e_Technische_Dokumentation.pdf"
      verbose: true
      exclude_pages:
        - "index.md"
        - "Home"                         # zusätzlich versuchen
      heading_shift: false
      include_home: false

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js